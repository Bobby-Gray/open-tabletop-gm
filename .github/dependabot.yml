# Keeps the automation and dependency surfaces current.
#
# Two surfaces exist: the GitHub Actions CI uses, and the display companion's
# requirements.txt (flask, flask-cors, pygame, numpy). The probe tool imports
# only the standard library and ships no manifest, so it needs no entry — a
# directory without a manifest would only make Dependabot error.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /display
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
